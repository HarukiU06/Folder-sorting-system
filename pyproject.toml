[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshelf"
version = "0.1.0"
description = "Watches a folder and sorts new files into your own subfolders by reading their names and text."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HarukiU06" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
]
# PySide6 is added in Phase 4. sentence-transformers pulls in PyTorch (the CPU build on
# Windows); the model itself is downloaded on first use.
dependencies = [
    "watchdog>=6.0",
    # classification (Phase 3)
    "numpy>=2.5",
    "sentence-transformers>=6.1",
    # text extraction (Phase 2)
    "pymupdf>=1.28",
    "python-docx>=1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "ebooklib>=0.20",
    "striprtf>=0.0.33",
    "beautifulsoup4>=4.15",
    # text metadata of media files
    "mutagen>=1.48",
    "pillow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
autoshelf = "autoshelf.cli:main"

[tool.setuptools.packages.find]
include = ["autoshelf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # long extension lists read better as one split string
