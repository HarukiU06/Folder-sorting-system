[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshelf"
version = "0.2.0"
description = "Watches a folder and sorts new files into your own subfolders by reading their names and text."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "HarukiU06" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
]
# sentence-transformers pulls in PyTorch (the CPU build on Windows); the model itself is
# downloaded on first use.
dependencies = [
    "watchdog>=6.0",
    # desktop app (Phase 4); LGPL
    "PySide6-Essentials>=6.12",
    # Windows 11 style widgets; GPLv3, brings PySide6, PySideSix-Frameless-Window (LGPLv3),
    # pywin32 (PSF) and darkdetect (BSD)
    "PySide6-Fluent-Widgets>=1.11.3",
    # classification (Phase 3)
    "numpy>=2.5",
    "sentence-transformers>=6.1",
    # text extraction (Phase 2)
    "pymupdf>=1.28",
    "python-docx>=1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "ebooklib>=0.20",
    "striprtf>=0.0.33",
    "beautifulsoup4>=4.15",
    # text metadata of media files
    "mutagen>=1.48",
    "pillow>=12.0",
    # PDF to Word copies (Phase 13); MIT, brings opencv-python-headless (Apache-2.0)
    "pdf2docx>=0.5.13",
    # the optional Claude API key lives in the Windows Credential Manager (Phase 7)
    "keyring>=25.7",
    # notifications with buttons (Phase 14); Apache-2.0, brings the MIT-licensed winrt packages
    "windows-toasts>=1.3.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.5", "ruff>=0.6"]
# packaging: see packaging/build.ps1
build = ["pyinstaller>=6.22"]

[project.scripts]
autoshelf = "autoshelf.cli:main"

[project.gui-scripts]
autoshelf-app = "autoshelf.ui.app:main"

[tool.setuptools.packages.find]
include = ["autoshelf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["real_model: may load the real language model (opt-in, see test_embedder.py)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # long extension lists read better as one split string
